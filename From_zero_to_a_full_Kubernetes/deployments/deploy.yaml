apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: testkr
  name: testkr
spec:
  replicas: 5
  selector:
    matchLabels:
      app: testkr
  template:
    metadata:
      labels:
        app: testkr
    spec:
      containers:
        - image: httpd:alpine3.18
          name: httpdd
          command: ["/bin/bash", "-c"] # override the default command
          args: ["sleep 5; exit 1"] # sleep for 30 seconds then exit with an error
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
